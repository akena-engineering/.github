<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 168" width="880" height="168" role="img" aria-label="AKENA - Ambitious ideas deserve exceptional engineering">
  <style>
    .in{transform-box:fill-box;opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .mark{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:pop .9s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
    .net{opacity:0;animation:fade 1.2s ease .5s forwards}
    @keyframes fade{to{opacity:1}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .node{animation:breathe 4s ease-in-out infinite}
    .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}
    .n5{animation-delay:2.4s}.n6{animation-delay:3s}.n7{animation-delay:3.4s}.n8{animation-delay:1.5s}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .in,.mark,.net{animation:none;opacity:1}
      .cur,.node{animation:none}
      .pulse{display:none}
    }
  </style>

  <rect x="0.5" y="0.5" width="879" height="167" rx="14" fill="#0C0A09" stroke="#262421"/>

  <!-- Akena mark -->
  <g class="mark">
    <g transform="translate(42,61) scale(1.92)">
      <path d="M14.2.6Q15 0 15.8 0q.7 0 1.6.5.9.8 1.5 2L31.8 24h-6.3q-1.6-3-3.3-5.7H10.9l2.6-4.5h6l-3.1-5.2-.7-1L6 24H0L12.9 2.5q.5-1 1.3-2" fill="#ececeb"/>
    </g>
  </g>

  <!-- Wordmark and tagline -->
  <text class="in d1" x="128" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="8" fill="#ececeb">AKENA</text>
  <text class="in d2" x="130" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#8a8a86">AMBITIOUS IDEAS DESERVE EXCEPTIONAL ENGINEERING</text>
  <g class="in d3">
    <text x="130" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b6a66">$ no hype, just engineering</text>
    <rect class="cur" x="342" y="125" width="7" height="13" fill="#8a8a86"/>
  </g>

  <!-- Node network -->
  <g class="net">
    <g stroke="#3a3833" stroke-width="1">
      <path d="M596,52 L688,30"/>
      <path d="M688,30 L800,44"/>
      <path d="M596,52 L628,104"/>
      <path d="M688,30 L722,84"/>
      <path d="M800,44 L832,96"/>
      <path d="M628,104 L722,84"/>
      <path d="M722,84 L832,96"/>
      <path d="M628,104 L668,142"/>
      <path d="M668,142 L776,136"/>
      <path d="M722,84 L776,136"/>
      <path d="M832,96 L776,136"/>
    </g>
    <g fill="#8a8a86">
      <circle class="node" cx="596" cy="52" r="3.5"/>
      <circle class="node n2" cx="688" cy="30" r="3.5"/>
      <circle class="node n3" cx="800" cy="44" r="3.5"/>
      <circle class="node n4" cx="628" cy="104" r="3.5"/>
      <circle class="node n5" cx="722" cy="84" r="4.5"/>
      <circle class="node n6" cx="832" cy="96" r="3.5"/>
      <circle class="node n7" cx="668" cy="142" r="3.5"/>
      <circle class="node n8" cx="776" cy="136" r="3.5"/>
    </g>
    <circle class="pulse" r="2.4" fill="#ececeb">
      <animateMotion dur="5s" repeatCount="indefinite" begin="0.8s" path="M596,52 L688,30 L722,84 L776,136"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="5s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle class="pulse" r="2.4" fill="#ececeb">
      <animateMotion dur="4.2s" repeatCount="indefinite" begin="2s" path="M832,96 L722,84 L628,104"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.2s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle class="pulse" r="2.4" fill="#ececeb">
      <animateMotion dur="5.6s" repeatCount="indefinite" begin="3.2s" path="M688,30 L800,44 L832,96 L776,136"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="5.6s" repeatCount="indefinite" begin="3.2s"/>
    </circle>
  </g>
</svg>
